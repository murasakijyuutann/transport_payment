<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransitPay — Register</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="shell auth-card">
      <p class="brand">TransitPay</p>
      <h1>Create account</h1>
      <p class="lede">Issues a transit account, wallet, and card token.</p>
      <div id="error" class="error" hidden></div>
      <form id="register-form" class="panel stack">
        <label>First name <input name="firstName" required /></label>
        <label>Last name <input name="lastName" required /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Password <input name="password" type="password" minlength="8" required /></label>
        <button class="primary" type="submit">Register</button>
      </form>
      <p class="meta">Already registered? <a href="/index.html">Sign in</a></p>
    </main>
    <script type="module" src="/src/pages/register.ts"></script>
  </body>
</html>
