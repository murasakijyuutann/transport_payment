name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker/postgres/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker/postgres/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transport_user
          POSTGRES_PASSWORD: your_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transport_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://transport_user:your_password@localhost:5432/transport_abt_test
      TEST_DATABASE_URL: postgresql://transport_user:your_password@localhost:5432/transport_abt_test
      ADMIN_DATABASE_URL: postgresql://transport_user:your_password@localhost:5432/postgres
      JWT_SECRET: ci-test-jwt-secret-32chars!!!!
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
